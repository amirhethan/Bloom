name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build NSIS bundle
        run: cargo tauri build
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # default `packages` is "tools platform-tools"; the `tools` package no longer exists
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Init the Android project
        run: cargo tauri android init --ci
        working-directory: src-tauri
      # the committed test key keeps updates installable across releases
      - name: Signing config
        run: |
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/src-tauri/android/bloom-release.jks
          password=bloom-release
          keyAlias=bloom
          storePassword=bloom-release
          keyPassword=bloom-release
          EOF
      - name: Build APK (release, signed)
        run: cargo tauri android build --apk --target aarch64
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name the APK after the ABI
        run: |
          set -e
          for f in $(find artifacts/android-apk -name '*.apk'); do
            mv "$f" "artifacts/android-apk/Bloom_${GITHUB_REF_NAME#v}_arm64.apk"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/*.exe
            artifacts/android-apk/*.apk
          generate_release_notes: true

[package]
name = "bloom"
version = "0.1.0"
description = "Bloom — a canvas for developing YouTube videos"
edition = "2021"

[lib]
name = "bloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

# Windows Credential Manager; Android stores the key in app-private storage instead
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[[bin]]
name = "Bloom"
path = "src/main.rs"

[profile.dev]
incremental = false

[profile.release]
incremental = false

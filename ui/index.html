<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bloom</title>
<link rel="icon" href="favicon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main id="app">

  <!-- start screen -->
  <section class="screen" id="screen-start" hidden>
    <header class="tl start-brand">
      <svg class="logo" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 17V9" /><path d="M10 9C10 5.5 7.5 3.5 4 3.5 4 7 6.5 9 10 9Z" />
        <path d="M10 11C10 8 12.5 6.5 16 6.5 16 9.5 13.5 11 10 11Z" />
      </svg>
      <button class="wordmark" id="home-btn-start" aria-label="Open the canvas" data-i18n-aria="app.projects">Bloom</button>
    </header>

    <div class="start-page">
      <div class="start-head-row">
        <span class="type-label" data-i18n="app.projects">Projects</span>
        <div class="start-actions">
          <div class="segmented small" role="group" aria-label="Projects view">
            <button class="seg is-active" data-projects-view="nodes" data-i18n="projects.nodes">Nodes</button>
            <button class="seg" data-projects-view="list" data-i18n="projects.list">List</button>
            <button class="seg" data-projects-view="board" data-i18n="projects.board">Board</button>
          </div>
          <input class="input search-input" id="project-search" placeholder="Search boards"
                 aria-label="Search boards" data-i18n-placeholder="projects.search" data-i18n-aria="projects.search" />
          <select class="input select-small" id="project-sort" aria-label="Sort boards" data-i18n-aria="projects.sort">
            <option value="edited" data-i18n="projects.sortEdited">Edited</option>
            <option value="name" data-i18n="projects.sortName">Name</option>
          </select>
          <button class="btn btn-accent" id="new-board" data-i18n="projects.new">New board</button>
        </div>
      </div>

      <div class="filters" role="group" aria-label="Filter by status">
        <button class="filter is-active" data-filter="All" data-i18n="projects.all">All</button>
        <button class="filter" data-filter="Spark" data-i18n="status.Spark">Spark</button>
        <button class="filter" data-filter="Outlined" data-i18n="status.Outlined">Outlined</button>
        <button class="filter" data-filter="Scripted" data-i18n="status.Scripted">Scripted</button>
        <button class="filter" data-filter="Filmed" data-i18n="status.Filmed">Filmed</button>
        <button class="filter" data-filter="Edited" data-i18n="status.Edited">Edited</button>
        <button class="filter" data-filter="Published" data-i18n="status.Published">Published</button>
        <button class="filter" data-filter="Archived" data-i18n="projects.archived">Archived</button>
        <button class="filter" data-filter="Trash" data-i18n="projects.trash">Trash</button>
      </div>

      <div class="project-list" id="project-list"></div>
    </div>
    <button class="visually-hidden" id="import-bloom">Import .bloom</button>
  </section>

  <!-- canvas screen -->
  <section class="screen" id="screen-canvas">
    <div class="grid" id="grid" aria-hidden="true"></div>

    <header class="tl">
      <svg class="logo" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 17V9" /><path d="M10 9C10 5.5 7.5 3.5 4 3.5 4 7 6.5 9 10 9Z" />
        <path d="M10 11C10 8 12.5 6.5 16 6.5 16 9.5 13.5 11 10 11Z" />
      </svg>
      <button class="wordmark" id="home-btn" aria-label="Back to projects">Bloom</button>
      <span class="slash">/</span>
      <span class="project-name" id="project-name" contenteditable="true" dir="auto" spellcheck="false" title="Rename board" data-i18n-title="projects.rename">The 3-Hour Rule</span>
      <button class="status-pill" id="status-pill">Outlined</button>
      <button class="save-state" id="save-state" data-state="saved" aria-live="polite" title="All changes saved" data-i18n-title="app.saveTitle">
        <svg class="save-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4 4L19 7" /></svg>
        <span class="save-label" data-i18n="app.saved">Saved</span>
      </button>
    </header>

    <div class="tr">
      <button class="icon-btn lang-btn" id="lang-btn" aria-label="Language" data-i18n-aria="tool.lang" data-i18n-title="tool.lang" title="Language">
        <span class="lang-btn-text">EN</span>
      </button>
      <button class="icon-btn" id="ai-btn" aria-label="Ask" title="Ask (Ctrl+J)" data-i18n-aria="tool.ask">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.8 2.8M14.9 14.9l2.8 2.8M17.7 6.3l-2.8 2.8M9.1 14.9l-2.8 2.8"/></svg>
      </button>
      <button class="icon-btn" id="more-btn" aria-label="More" title="More" data-i18n-aria="tool.more">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg>
      </button>
      <button class="search-btn" id="search-btn">
        <span data-i18n="tool.search">Search or add</span>
        <kbd>/</kbd>
      </button>
      <div class="segmented" role="group" aria-label="View">
        <button class="seg is-active" data-view="canvas" data-i18n="view.canvas">Canvas</button>
        <button class="seg" data-view="script" data-i18n="view.script">Script</button>
      </div>
    </div>

    <div class="context-bar" id="ctxbar" hidden></div>

    <div class="toolbar" role="toolbar" aria-label="Canvas tools">
      <button class="tool is-active" data-tool="select" aria-label="Select" data-i18n-aria="tool.select">
        <svg class="ic" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z" /></svg>
        <span class="tip"><span data-i18n="tool.select">Select</span><kbd>V</kbd></span>
      </button>
      <button class="tool" data-tool="pan" aria-label="Pan" data-i18n-aria="tool.pan">
        <svg class="ic" viewBox="0 0 24 24"><path d="M8 12V6a1.5 1.5 0 013 0v5M11 11V4.5a1.5 1.5 0 013 0V11M14 11V6a1.5 1.5 0 013 0v8a6 6 0 01-6 6h-1a5 5 0 01-4-2l-3-4a1.5 1.5 0 012-2l2 2" /></svg>
        <span class="tip"><span data-i18n="tool.pan">Pan</span><kbd>H</kbd></span>
      </button>
      <span class="tool-divider" aria-hidden="true"></span>
      <button class="tool" data-tool="card" aria-label="Add card" data-i18n-aria="tool.card">
        <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" /><path d="M12 8v8M8 12h8" /></svg>
        <span class="tip"><span data-i18n="tool.card">Add card</span><kbd>N</kbd></span>
      </button>
      <button class="tool" data-tool="frame" aria-label="Add frame" data-i18n-aria="tool.frame">
        <svg class="ic" viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M3 7h18M3 17h18" /></svg>
        <span class="tip"><span data-i18n="tool.frame">Add frame</span><kbd>F</kbd></span>
      </button>
      <button class="tool" data-tool="vine" aria-label="Draw vine" data-i18n-aria="tool.vine">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 18c0-6 5-10 14-10" /><path d="M14 4l4 4-4 4" /></svg>
        <span class="tip"><span data-i18n="tool.vine">Draw vine</span><kbd>C</kbd></span>
      </button>
      <button class="tool" data-tool="pen" aria-label="Pen" data-i18n-aria="tool.pen">
        <svg class="ic" viewBox="0 0 24 24"><path d="M4 20l1-4 11-11 3 3L8 19z" /><path d="M14 7l3 3" /></svg>
        <span class="tip"><span data-i18n="tool.pen">Pen</span><kbd>P</kbd></span>
      </button>
      <button class="tool" data-tool="image" aria-label="Add image" data-i18n-aria="tool.image">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" /><circle cx="9" cy="10" r="1.5" /><path d="M4 18l5-5 4 4 3-3 4 4" /></svg>
        <span class="tip"><span data-i18n="tool.image">Add image</span><kbd>I</kbd></span>
      </button>
    </div>

    <div class="pen-popover" id="penbar" hidden></div>

    <span class="snap-indicator" id="snap-indicator" hidden data-i18n="hint.snap">Snap</span>
    <button class="zoom-btn" id="zoom-btn" data-i18n-title="zoom.fit" title="Fit board to view">100%</button>

    <button class="minimap" id="minimap" aria-label="Minimap" data-i18n-aria="minimap.label">
      <svg id="minimap-svg" width="130" height="82" aria-hidden="true"></svg>
    </button>

    <div class="menu" id="menu" hidden></div>

    <p class="empty-hint" id="empty-hint" hidden data-i18n="hint.empty">Double-click anywhere to start · drag to pan · scroll to zoom</p>

    <div class="viewport" id="viewport">
      <div class="world" id="world">
        <svg class="world-svg" id="world-svg" width="2400" height="1600" aria-hidden="true"></svg>
        <div class="cards" id="cards"></div>
        <div class="handles" id="handles"></div>
      </div>
    </div>

    <div class="cmdbar" id="cmdbar" hidden>
      <div class="cmd-input-row">
        <span class="cmd-slash">/</span>
        <input id="cmd-input" type="text" placeholder="Add to the board…" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="palette.add" />
      </div>
      <div class="cmd-list" id="cmd-list"></div>
    </div>
  </section>

  <!-- script screen -->
  <section class="screen" id="screen-script" hidden>
    <div class="tr script-tr">
      <div class="segmented" role="group" aria-label="View">
        <button class="seg" data-view="canvas" data-i18n="view.canvas">Canvas</button>
        <button class="seg is-active" data-view="script" data-i18n="view.script">Script</button>
      </div>
    </div>

    <div class="script-page">
      <header class="script-head">
        <div>
          <h1 class="script-title" id="script-title">The 3-Hour Rule</h1>
          <p class="script-stats" id="script-stats"></p>
          <p class="script-warning" id="script-warning" hidden></p>
        </div>
        <div class="script-actions">
          <button class="btn" id="export-script" data-i18n="script.export">Export</button>
          <button class="btn btn-accent" id="teleprompter" data-i18n="script.teleprompter">Teleprompter</button>
        </div>
      </header>
      <div class="script-rule"></div>
      <div class="script-rows" id="script-rows"></div>
    </div>
  </section>

</main>

<div class="drawer" id="history-drawer" hidden>
  <header class="drawer-head">
    <h2 data-i18n="history.title">History</h2>
    <button class="icon-btn" id="history-close" aria-label="Close history" data-i18n-aria="common.close"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="drawer-actions"><button class="btn btn-small" id="snapshot-now" data-i18n="history.snapshotNow">Snapshot now</button></div>
  <div class="drawer-body" id="history-list"></div>
  <p class="drawer-note" data-i18n="history.note">Bloom snapshots automatically every ten minutes and before any restore.</p>
</div>

<div class="drawer drawer-wide" id="ai-drawer" hidden>
  <header class="drawer-head">
    <h2 data-i18n="ai.title">Ask</h2>
    <span class="model-chip" id="ai-model">claude-sonnet-5-5</span>
    <button class="icon-btn" id="ai-close" aria-label="Close Ask" data-i18n-aria="common.close"><svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="ai-context">
    <div class="ctx-chips" id="ai-chips"></div>
    <button class="ctx-preview-toggle" id="ai-preview-toggle" aria-expanded="false" data-i18n="ai.preview">What will be sent</button>
    <pre class="ai-preview" id="ai-preview" hidden></pre>
  </div>
  <div class="ai-actions" id="ai-actions"></div>
  <div class="ai-prompt">
    <input class="input" id="ai-prompt" placeholder="Ask for anything…" aria-label="Ask"
           data-i18n-placeholder="ai.prompt" data-i18n-aria="tool.ask" />
    <button class="btn btn-small btn-accent" id="ai-send" data-i18n="ai.send">Send</button>
  </div>
  <div class="ai-results" id="ai-results"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modal-root" hidden></div>
<div class="hints" id="hints" hidden></div>
<button class="visually-hidden" id="export-bloom">Export .bloom</button>
<button class="visually-hidden" id="open-history-btn">History</button>

<script type="module" src="app.js"></script>
</body>
</html>
